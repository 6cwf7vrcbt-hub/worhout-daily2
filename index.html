<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>筋トレ日記</title>
    <style>
      :root {
        --bg: #f5f7fb;
        --card: #fff;
        --primary: #1d4ed8;
        --primary-dark: #153da9;
        --muted: #64748b;
        --text: #1f2937;
        --danger: #dc2626;
        --success: #16a34a;
        --border: #dbeafe;
      }

      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: linear-gradient(135deg, #eef6ff 0%, #f8fafc 100%);
        font-family: "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
        color: var(--text);
      }
      .container {
        max-width: 1200px;
        margin: 32px auto;
        padding: 20px;
      }
      .card {
        background: var(--card);
        border-radius: 24px;
        box-shadow: 0 12px 28px rgba(15, 23, 42, 0.12);
        padding: 24px;
      }
      h1 {
        margin: 0 0 16px;
        font-size: clamp(2rem, 3vw, 2.6rem);
      }
      .header-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 12px;
        margin-bottom: 20px;
      }
      .summary {
        background: #eff6ff;
        color: var(--primary-dark);
        padding: 10px 14px;
        border-radius: 12px;
        font-weight: 700;
      }
      .content {
        display: grid;
        grid-template-columns: 1.7fr 1fr;
        gap: 22px;
      }
      @media (max-width: 900px) {
        .content { grid-template-columns: 1fr; }
      }

      form {
        display: grid;
        gap: 16px;
      }
      .form-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
        gap: 14px;
      }
      label {
        display: flex;
        flex-direction: column;
        gap: 8px;
        color: var(--muted);
        font-size: 0.95rem;
      }
      input, textarea, button, select {
        font: inherit;
      }
      input, textarea, select {
        width: 100%;
        border: 1px solid #cbd5e1;
        border-radius: 12px;
        padding: 12px 14px;
        background: #fff;
        color: var(--text);
      }
      textarea {
        min-height: 90px;
        resize: vertical;
      }
      .submit-btn, .small-btn, .delete-btn, .timer-btn, .preset-btn {
        border: none;
        border-radius: 12px;
        cursor: pointer;
        transition: transform 0.15s ease;
      }
      .submit-btn:hover, .small-btn:hover, .delete-btn:hover, .timer-btn:hover, .preset-btn:hover {
        transform: translateY(-1px);
      }
      .submit-btn {
        background: var(--primary);
        color: white;
        padding: 12px 20px;
        font-weight: 700;
        width: fit-content;
      }
      .empty {
        text-align: center;
        padding: 28px 12px;
        border: 1px dashed #cbd5e1;
        border-radius: 12px;
        color: var(--muted);
        background: #f8fafc;
      }
      .entries {
        list-style: none;
        margin: 24px 0 0;
        padding: 0;
        display: grid;
        gap: 12px;
      }
      .entry {
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        background: #f8fafc;
        padding: 16px;
      }
      .entry-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 10px;
        margin-bottom: 10px;
      }
      .entry-date {
        font-weight: 700;
        color: var(--primary-dark);
      }
      .delete-btn {
        background: #fee2e2;
        color: var(--danger);
        padding: 8px 12px;
        font-weight: 700;
      }
      .entry-main {
        display: flex;
        flex-wrap: wrap;
        gap: 8px 14px;
        font-size: 0.96rem;
      }
      .entry-note {
        margin-top: 10px;
        color: var(--muted);
        white-space: pre-wrap;
        line-height: 1.6;
      }

      .sidebar {
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 18px;
        padding: 18px;
      }
      .timer-panel {
        background: linear-gradient(135deg, #111827, #1f2937);
        color: white;
        border-radius: 18px;
        padding: 18px;
        margin-bottom: 16px;
      }
      .timer-panel h3 {
        margin: 0 0 12px;
      }
      .timer-display {
        font-size: clamp(2rem, 4vw, 3rem);
        font-weight: 800;
        text-align: center;
        letter-spacing: 0.08em;
        font-variant-numeric: tabular-nums;
      }
      .timer-controls {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 12px;
      }
      .timer-btn {
        padding: 10px 12px;
        font-weight: 700;
      }
      .timer-start { background: var(--success); color: white; }
      .timer-stop { background: #fca5a5; color: #7f1d1d; }
      .timer-reset { background: #e5e7eb; color: var(--text); }
      .timer-input-row {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 8px;
        margin-top: 12px;
      }
      .timer-input-row input {
        background: rgba(255,255,255,0.08);
        border-color: rgba(255,255,255,0.2);
        color: white;
      }
      .timer-input-row button {
        background: #f5f3ff;
        color: var(--primary-dark);
        padding: 10px 12px;
        border: none;
        border-radius: 10px;
        font-weight: 700;
        cursor: pointer;
      }
      .preset-row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-top: 12px;
      }
      .preset-btn {
        background: rgba(255,255,255,0.08);
        color: white;
        border: 1px solid rgba(255,255,255,0.2);
        padding: 8px 10px;
      }
      .tool-checklist {
        display: grid;
        gap: 10px;
        margin-bottom: 18px;
      }
      .tool-option {
        display: flex;
        align-items: center;
        gap: 10px;
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 8px 10px;
      }
      .tool-option input {
        width: 18px;
        height: 18px;
      }
      .recommend-box {
        background: #eff6ff;
        border: 1px solid #bfdbfe;
        border-radius: 14px;
        padding: 14px;
        margin-top: 12px;
      }
      .recommend-box h3 {
        margin: 0 0 10px;
      }
      .recommend-list {
        list-style: none;
        margin: 0;
        padding: 0;
        display: grid;
        gap: 8px;
      }
      .recommend-list li {
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 8px 10px;
      }
      .library-form {
        display: grid;
        gap: 8px;
        margin-bottom: 12px;
      }
      .small-btn {
        background: var(--primary);
        color: white;
        padding: 10px 14px;
        font-weight: 700;
      }
      .library-list {
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        gap: 8px;
      }
      .library-item {
        background: #fff;
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 10px 12px;
        cursor: pointer;
      }
      .library-item strong {
        display: block;
        margin-bottom: 4px;
      }
      .library-item small {
        color: var(--muted);
      }
      .input-wrap { position: relative; }
      .suggestions {
        position: absolute;
        left: 0;
        right: 0;
        top: calc(100% + 6px);
        background: white;
        border: 1px solid #dbeafe;
        border-radius: 12px;
        box-shadow: 0 12px 24px rgba(15,23,42,0.12);
        z-index: 20;
        overflow: hidden;
      }
      .suggestions.hidden { display: none; }
      .suggestion-item {
        width: 100%;
        text-align: left;
        border: none;
        background: white;
        padding: 10px 12px;
        cursor: pointer;
      }
      .suggestion-item:hover { background: #eff6ff; }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="card">
        <div class="header-row">
          <h1>筋トレ日記</h1>
          <div id="totalCount" class="summary">記録数: 0</div>
        </div>

        <div class="content">
          <div>
            <form id="logForm">
              <div class="form-grid">
                <label>
                  日付
                  <input type="date" id="date" required />
                </label>
                <label>
                  部位
                  <input type="text" id="part" placeholder="胸・脚・背中" required />
                </label>
                <label>
                  種目
                  <div class="input-wrap">
                    <input type="text" id="exercise" placeholder="ベンチプレス" autocomplete="off" required />
                    <div id="suggestions" class="suggestions hidden" aria-live="polite"></div>
                  </div>
                </label>
                <label>
                  セット数
                  <input type="number" id="sets" min="1" value="3" required />
                </label>
                <label>
                  回数
                  <input type="number" id="reps" min="1" value="10" required />
                </label>
                <label>
                  重量(kg)
                  <input type="number" id="weight" min="0" step="0.5" value="0" required />
                </label>
              </div>

              <label>
                種目メモ
                <textarea id="exerciseComment" placeholder="フォームが良かった・少し重かったなど"></textarea>
              </label>

              <label>
                記録メモ
                <textarea id="memo" placeholder="今日は胸の張りが良かった..."></textarea>
              </label>

              <button type="submit" class="submit-btn">記録を追加</button>
            </form>

            <ul id="entries" class="entries"></ul>
          </div>

          <aside class="sidebar">
            <div class="timer-panel">
              <h3>レストタイマー</h3>
              <div id="timerDisplay" class="timer-display">01:30</div>
              <div class="timer-controls">
                <button id="timerStartBtn" class="timer-btn timer-start" type="button">開始</button>
                <button id="timerStopBtn" class="timer-btn timer-stop" type="button">停止</button>
                <button id="timerResetBtn" class="timer-btn timer-reset" type="button">リセット</button>
              </div>
              <div class="timer-input-row">
                <input type="number" id="customTimerInput" min="0" max="600" step="5" value="90" aria-label="休憩時間（秒）" />
                <button id="customTimerBtn" type="button">セット</button>
              </div>
              <div class="preset-row">
                <button class="preset-btn" type="button" data-seconds="30">30s</button>
                <button class="preset-btn" type="button" data-seconds="60">1m</button>
                <button class="preset-btn" type="button" data-seconds="90">1:30</button>
                <button class="preset-btn" type="button" data-seconds="180">3m</button>
              </div>
            </div>

            <h2>持っている道具</h2>
            <div id="toolChecklist" class="tool-checklist"></div>

            <div class="recommend-box">
              <h3>おすすめ種目</h3>
              <ul id="recommendations" class="recommend-list"></ul>
            </div>

            <h2 style="margin-top: 18px;">種目ライブラリ</h2>
            <div class="library-form">
              <input id="newExerciseName" type="text" placeholder="種目名 例: ディップス" />
              <textarea id="newExerciseComment" rows="3" placeholder="コメントを追加"></textarea>
              <button id="addExerciseBtn" type="button" class="small-btn">種目を追加</button>
            </div>
            <ul id="exerciseLibraryList" class="library-list"></ul>
          </aside>
        </div>
      </div>
    </div>

    <script>
      const STORAGE_KEY = 'workout-diary-entries';
      const LIBRARY_KEY = 'workout-exercise-library';
      const TOOLS_KEY = 'workout-tools';
      const TIMER_KEY = 'workout-timer';

      const defaultLibrary = [
        { name: 'ベンチプレス', comment: '胸の押し上げ、フォーム重視', tools: ['ベンチ', 'バーベル', 'プレート'] },
        { name: 'ダンベルプレス', comment: '胸を伸ばしながら押せる', tools: ['ダンベル', 'ベンチ'] },
        { name: 'ダンベルカール', comment: '上腕二頭筋を集中させやすい', tools: ['ダンベル'] },
        { name: 'ダンベルスクワット', comment: '脚と体幹を安定させる', tools: ['ダンベル'] },
        { name: 'ダンベルフライ', comment: '胸の伸びを感じやすい', tools: ['ダンベル', 'ベンチ'] },
        { name: 'オーバーヘッドプレス', comment: '肩の強化におすすめ', tools: ['バーベル', 'プレート', 'ラック'] },
        { name: 'スクワット', comment: '下半身の基本種目', tools: ['バーベル', 'プレート', 'ラック'] },
        { name: 'デッドリフト', comment: '背中と脚を一緒に鍛える', tools: ['バーベル', 'プレート'] },
        { name: '懸垂', comment: '背中の大きな種目', tools: ['懸垂バー'] },
        { name: 'ラットプルダウン', comment: '背中の引き系で使いやすい', tools: ['ラットプルダウン機'] },
        { name: 'レッグプレス', comment: '脚の筋肥大に適している', tools: ['レッグプレス機'] },
        { name: 'ランニング', comment: '持久力と有酸素', tools: ['ランニングマシン'] },
        { name: '縄跳び', comment: '足腰と持久力を鍛える', tools: ['縄跳び'] },
        { name: 'プランク', comment: '体幹を安定させる', tools: ['マット'] },
        { name: 'クランチ', comment: '腹筋を集中', tools: ['マット'] }
      ];

      const allTools = ['ダンベル', 'ベンチ', 'バーベル', 'プレート', 'ラック', '懸垂バー', 'ケーブルマシン', 'ラットプルダウン機', 'レッグプレス機', 'ランニングマシン', 'マット', '縄跳び'];

      const form = document.getElementById('logForm');
      const entriesList = document.getElementById('entries');
      const totalCount = document.getElementById('totalCount');
      const exerciseInput = document.getElementById('exercise');
      const exerciseCommentInput = document.getElementById('exerciseComment');
      const suggestionBox = document.getElementById('suggestions');
      const libraryList = document.getElementById('exerciseLibraryList');
      const toolChecklist = document.getElementById('toolChecklist');
      const recommendationsList = document.getElementById('recommendations');
      const timerDisplay = document.getElementById('timerDisplay');

      let timerRemaining = 90;
      let timerIntervalId = null;
      let alarmAudioContext = null;

      function saveJSON(key, value) {
        localStorage.setItem(key, JSON.stringify(value));
      }
      function loadJSON(key, fallback) {
        const raw = localStorage.getItem(key);
        if (!raw) return fallback;
        try {
          return JSON.parse(raw);
        } catch {
          return fallback;
        }
      }

      function getLibrary() {
        const saved = loadJSON(LIBRARY_KEY, defaultLibrary);
        if (Array.isArray(saved) && saved.length > 0) return saved;
        saveJSON(LIBRARY_KEY, defaultLibrary);
        return defaultLibrary;
      }

      function saveLibrary(list) {
        saveJSON(LIBRARY_KEY, list);
      }

      function getEntries() {
        return loadJSON(STORAGE_KEY, []);
      }

      function saveEntries(list) {
        saveJSON(STORAGE_KEY, list);
      }

      function getSelectedTools() {
        return loadJSON(TOOLS_KEY, []);
      }

      function saveSelectedTools(list) {
        saveJSON(TOOLS_KEY, list);
      }

      function escapeHtml(str) {
        return String(str)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      function renderEntries() {
        const entries = [...getEntries()].sort((a, b) => b.date.localeCompare(a.date));
        totalCount.textContent = `記録数: ${entries.length}`;

        if (!entries.length) {
          entriesList.innerHTML = '<li class="empty">まだ記録がありません。最初の記録を追加してください。</li>';
          return;
        }

        entriesList.innerHTML = entries.map((entry) => `
          <li class="entry">
            <div class="entry-top">
              <div class="entry-date">${entry.date}</div>
              <button class="delete-btn" data-id="${entry.id}" type="button">削除</button>
            </div>
            <div class="entry-main">
              <span><strong>部位:</strong> ${escapeHtml(entry.part)}</span>
              <span><strong>種目:</strong> ${escapeHtml(entry.exercise)}</span>
              <span><strong>セット:</strong> ${entry.sets} × ${entry.reps}</span>
              <span><strong>重量:</strong> ${entry.weight} kg</span>
            </div>
            ${entry.exerciseComment ? `<div class="entry-note"><strong>種目メモ:</strong> ${escapeHtml(entry.exerciseComment)}</div>` : ''}
            ${entry.memo ? `<div class="entry-note"><strong>記録メモ:</strong> ${escapeHtml(entry.memo)}</div>` : ''}
          </li>
        `).join('');
      }

      function renderLibrary() {
        const library = getLibrary();
        libraryList.innerHTML = library.map((item) => `
          <li class="library-item" data-name="${escapeHtml(item.name)}" data-comment="${escapeHtml(item.comment || '')}">
            <strong>${escapeHtml(item.name)}</strong>
            <small>${escapeHtml(item.comment || 'コメントなし')}</small>
          </li>
        `).join('');
      }

      function renderToolChecklist() {
        const selected = new Set(getSelectedTools());
        toolChecklist.innerHTML = allTools.map((tool) => `
          <label class="tool-option">
            <input type="checkbox" value="${tool}" ${selected.has(tool) ? 'checked' : ''} />
            <span>${tool}</span>
          </label>
        `).join('');

        toolChecklist.querySelectorAll('input').forEach((input) => {
          input.addEventListener('change', () => {
            const checked = [...toolChecklist.querySelectorAll('input:checked')].map((el) => el.value);
            saveSelectedTools(checked);
            renderRecommendations();
          });
        });
      }

      function renderRecommendations() {
        const selected = getSelectedTools();
        const library = getLibrary();
        if (!selected.length) {
          recommendationsList.innerHTML = '<li>道具を選ぶとおすすめ種目が出ます。</li>';
          return;
        }

        const filtered = library
          .filter((item) => (item.tools || []).some((tool) => selected.includes(tool)))
          .sort((a, b) => {
            const scoreA = (a.tools || []).filter((tool) => selected.includes(tool)).length;
            const scoreB = (b.tools || []).filter((tool) => selected.includes(tool)).length;
            return scoreB - scoreA;
          })
          .slice(0, 6);

        recommendationsList.innerHTML = filtered.length
          ? filtered.map((item) => `<li><strong>${escapeHtml(item.name)}</strong><br>${escapeHtml(item.comment || '')}</li>`).join('')
          : '<li>条件に合う種目がまだありません。</li>';
      }

      function getMatches(keyword) {
        const q = keyword.trim();
        if (!q) return [];
        const normalizedQ = q.toLowerCase().replace(/[（）()\s]/g, '');

        return getLibrary()
          .map((item) => {
            const name = item.name;
            const normalizedName = name.toLowerCase().replace(/[（）()\s]/g, '');
            let score = 999;
            if (name.startsWith(q)) score = 0;
            else if (normalizedName.startsWith(normalizedQ)) score = 1;
            else if (name.includes(q)) score = 2;
            else if (normalizedName.includes(normalizedQ)) score = 3;
            else if ((item.comment || '').toLowerCase().includes(q.toLowerCase())) score = 4;
            return { name, score };
          })
          .filter((item) => item.score < 999)
          .sort((a, b) => a.score - b.score || a.name.localeCompare(b.name))
          .slice(0, 8)
          .map((item) => item.name);
      }

      function showSuggestions() {
        const matches = getMatches(exerciseInput.value);
        if (!matches.length) {
          suggestionBox.innerHTML = '';
          suggestionBox.classList.add('hidden');
          return;
        }

        suggestionBox.innerHTML = matches.map((name) => `
          <button type="button" class="suggestion-item" data-value="${escapeHtml(name)}">${escapeHtml(name)}</button>
        `).join('');
        suggestionBox.classList.remove('hidden');
      }

      function hideSuggestions() {
        suggestionBox.classList.add('hidden');
        suggestionBox.innerHTML = '';
      }

      function ensureAudioContext() {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return null;
        if (!alarmAudioContext) alarmAudioContext = new AudioContextClass();
        if (alarmAudioContext.state === 'suspended') alarmAudioContext.resume().catch(() => {});
        return alarmAudioContext;
      }

      function playAlarmSound() {
        const audioCtx = ensureAudioContext();
        if (!audioCtx) return;

        const pattern = [392.0, 523.25, 659.25, 523.25, 587.33, 659.25, 523.25, 440.0];
        const start = audioCtx.currentTime + 0.05;

        pattern.forEach((freq, index) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          const t = start + index * 0.22;

          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, t);
          gain.gain.setValueAtTime(0.0001, t);
          gain.gain.linearRampToValueAtTime(0.06, t + 0.04);
          gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.18);

          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(t);
          osc.stop(t + 0.18);
        });
      }

      function formatTime(totalSeconds) {
        const minutes = String(Math.floor(totalSeconds / 60)).padStart(2, '0');
        const seconds = String(totalSeconds % 60).padStart(2, '0');
        return `${minutes}:${seconds}`;
      }

      function renderTimer() {
        timerDisplay.textContent = formatTime(timerRemaining);
      }

      function saveTimerState() {
        saveJSON(TIMER_KEY, { remaining: timerRemaining });
      }

      function startTimer() {
        if (timerIntervalId !== null) return;

        timerIntervalId = setInterval(() => {
          if (timerRemaining <= 0) {
            clearInterval(timerIntervalId);
            timerIntervalId = null;
            timerRemaining = 0;
            renderTimer();
            playAlarmSound();
            return;
          }
          timerRemaining -= 1;
          renderTimer();
          saveTimerState();
        }, 1000);
      }

      function stopTimer() {
        if (timerIntervalId !== null) {
          clearInterval(timerIntervalId);
          timerIntervalId = null;
        }
        saveTimerState();
      }

      function resetTimer(seconds = 90) {
        stopTimer();
        timerRemaining = Math.max(0, Number(seconds) || 0);
        renderTimer();
        saveTimerState();
      }

      function initializeTimer() {
        const saved = loadJSON(TIMER_KEY, { remaining: 90 });
        timerRemaining = Number(saved.remaining) || 90;
        renderTimer();
      }

      form.addEventListener('submit', (event) => {
        event.preventDefault();

        const entry = {
          id: String(Date.now()),
          date: document.getElementById('date').value,
          part: document.getElementById('part').value.trim(),
          exercise: exerciseInput.value.trim(),
          exerciseComment: exerciseCommentInput.value.trim(),
          sets: Number(document.getElementById('sets').value),
          reps: Number(document.getElementById('reps').value),
          weight: Number(document.getElementById('weight').value),
          memo: document.getElementById('memo').value.trim()
        };

        if (!entry.date || !entry.part || !entry.exercise) {
          alert('日付・部位・種目を入力してください。');
          return;
        }

        const entries = getEntries();
        entries.push(entry);
        saveEntries(entries);
        form.reset();
        document.getElementById('date').value = new Date().toISOString().slice(0, 10);
        renderEntries();
      });

      entriesList.addEventListener('click', (event) => {
        const button = event.target.closest('.delete-btn');
        if (!button) return;
        const id = button.dataset.id;
        const entries = getEntries().filter((item) => item.id !== id);
        saveEntries(entries);
        renderEntries();
      });

      exerciseInput.addEventListener('input', showSuggestions);
      suggestionBox.addEventListener('click', (event) => {
        const button = event.target.closest('.suggestion-item');
        if (!button) return;
        exerciseInput.value = button.dataset.value;
        const match = getLibrary().find((item) => item.name === exerciseInput.value);
        if (match) exerciseCommentInput.value = match.comment || '';
        hideSuggestions();
      });

      document.addEventListener('click', (event) => {
        if (!event.target.closest('#exercise') && !event.target.closest('.suggestion-item')) {
          hideSuggestions();
        }
      });

      libraryList.addEventListener('click', (event) => {
        const item = event.target.closest('.library-item');
        if (!item) return;
        exerciseInput.value = item.dataset.name;
        exerciseCommentInput.value = item.dataset.comment || '';
        hideSuggestions();
      });

      document.getElementById('addExerciseBtn').addEventListener('click', () => {
        const name = document.getElementById('newExerciseName').value.trim();
        const comment = document.getElementById('newExerciseComment').value.trim();
        if (!name) {
          alert('種目名を入力してください。');
          return;
        }

        const library = getLibrary();
        const existing = library.find((item) => item.name === name);
        if (existing) {
          existing.comment = comment || existing.comment || '';
        } else {
          library.push({ name, comment, tools: [] });
        }
        saveLibrary(library);

        document.getElementById('newExerciseName').value = '';
        document.getElementById('newExerciseComment').value = '';
        renderLibrary();
        exerciseInput.value = name;
        exerciseCommentInput.value = comment;
      });

      document.getElementById('timerStartBtn').addEventListener('click', startTimer);
      document.getElementById('timerStopBtn').addEventListener('click', stopTimer);
      document.getElementById('timerResetBtn').addEventListener('click', () => resetTimer(90));

      document.getElementById('customTimerBtn').addEventListener('click', () => {
        const value = Number(document.getElementById('customTimerInput').value);
        if (!Number.isFinite(value) || value < 0 || value > 600) {
          alert('0〜600秒で入力してください。');
          return;
        }
        resetTimer(value);
      });

      document.querySelectorAll('.preset-btn').forEach((button) => {
        button.addEventListener('click', () => {
          resetTimer(Number(button.dataset.seconds));
        });
      });

      document.getElementById('date').value = new Date().toISOString().slice(0, 10);
      renderEntries();
      renderLibrary();
      renderToolChecklist();
      renderRecommendations();
      initializeTimer();
    </script>
  </body>
</html>
